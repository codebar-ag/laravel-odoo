name: release

on:
  pull_request:
    types:
      - closed
    branches:
      - main
jobs:
  release:
    name: Release
    # Only merged PRs release. Closing a PR without merging (e.g. a superseded
    # Dependabot PR) must not tag its test-merge commit.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '0'
      # Tags are always full vMAJOR.MINOR.PATCH and only made here. A hand-made
      # two-part tag (v1.12) is read by Packagist as 1.12.0, so the next
      # computed v1.12.0 would point at another commit and be rejected.
      - name: Bump version and push tag
        id: tag
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          WITH_V: true
          RELEASE_BRANCHES: main
          DEFAULT_BUMP: minor

      # Publish the release with generated notes, so the changelog workflow
      # (on: release released) always has notes and nobody tags by hand.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.MY_GITHUB_TOKEN }}
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          generate_release_notes: true
