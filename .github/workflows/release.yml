name: release

on:
  pull_request:
    types:
      - closed
    branches:
      - main
jobs:
  release:
    name: Release
    # Only merged PRs release. Closing a PR without merging (e.g. a superseded
    # Dependabot PR) must not tag its test-merge commit.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: '0'
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          WITH_V: true
          RELEASE_BRANCHES: main
          DEFAULT_BUMP: minor
